format = """$shell$username$hostname$localip$shlvl$singularity$kubernetes$directory$vcsh$fossil_branch$fossil_metrics${custom.git_smart_branch}$git_commit$git_state$git_metrics$git_status$hg_branch$hg_state$pijul_channel$docker_context$package$c$cmake$cobol$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$fortran$gleam$golang$guix_shell$haskell$haxe$helm$java$julia$kotlin$gradle$lua$nim$nodejs$ocaml$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$terraform$typst$vlang$vagrant$zig$buf$nix_shell$conda$meson$spack$memory_usage$aws$gcloud$openstack$azure$nats$direnv$env_var$mise$crystal$sudo$cmd_duration$line_break$jobs$battery$time$status$os$container$netns$character"""

[shell]
disabled = false
fish_indicator = "🐟 "
xonsh_indicator = "🦄 "
zsh_indicator = "🦓 "
bash_indicator = "🐚 "
unknown_indicator = "❓ "
format = "$indicator"

[git_branch]
disabled = true

[directory]
truncation_length = 4
repo_root_style = "bold blue"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

# Replaces git_branch with worktree awareness.
# Normal repo:   "on  branch"
# Worktree:      "on 🌳 repo-name  branch"
[custom.git_smart_branch]
command = """
BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null || git rev-parse --short HEAD 2>/dev/null)
[ -z "$BRANCH" ] && exit 1
MAIN=$(git worktree list --porcelain 2>/dev/null | awk '/^worktree/ {print $2; exit}')
CURR=$(git rev-parse --show-toplevel 2>/dev/null)
if [ -n "$MAIN" ] && [ "$MAIN" != "$CURR" ]; then
  REPO=$(basename "$MAIN")
  echo "$REPO 🌳 $BRANCH"
else
  echo " $BRANCH"
fi
"""
format = "on [$output](bold purple) "
shell = ["sh"]
when = "git rev-parse --git-dir 2>/dev/null"
